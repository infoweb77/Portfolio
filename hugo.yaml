baseURL: "https://infoweb77.gitlab.io/Portfolio/"
#locale: ru-ru

defaultContentLanguage: ru
defaultContentLanguageInSubdir: true

languages:
  ru:
    languageName: "Русский"
    weight: 1
    title: "Александр Шубин. Портфолио."
    copyright: "© Александр Шубин"
    params:
      homeInfoParams:
        Title: "iOS-разработчик"
        Content: |
          Всем добрый день. Меня зовут Александр Шубин. Я рад приветствовать Вас на страницах своего портфолио.
    menus:
      main:
        - name: "Главная"
          pageRef: /ru/home
          weight: 1
        #- name: "Резюме"
        #  pageRef: /CV
        #  weight: 2

  en:
    languageName: "English"
    weight: 2
    title: "Alexander Shubin. Portfolio."
    copyright: "© Alexander Shubin"
    params:
      homeInfoParams:
        Title: "iOS Developer"
        Content: |
          Hello everyone. My name is Alexander Shubin. I'm glad to welcome you to my portfolio pages.
    menus:
      main:
        - name: "Home"
          pageRef: /en/home
          weight: 1
        #- name: "Resume"
        #  pageRef: /CV
        #  weight: 2

theme: ["PaperMod"]

pagination:
  disableAliases: false
  pagerSize: 3

params:
  custom_css:
    - css/custom.css

  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/infoweb77"

markup:
  goldmark:
    renderer:
      unsafe: true

caches:
  images:
    dir: :cacheDir/images
